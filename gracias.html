<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gracias — Electricistas Madrid 24h Express</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f8f9fa; --surface: #ffffff; --fg: #191c1d; --muted: #424752;
    --border: #c2c6d4; --accent: #003f87; --gold: #feb700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--fg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: 3rem; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }
  .icon { width: 64px; height: 64px; background: #d3e3ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
  h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem; }
  p { color: var(--muted); line-height: 1.6; margin-bottom: 2rem; }
  .btn { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--accent); color: white; text-decoration: none; padding: 0.875rem 2rem; border-radius: 9999px; font-weight: 700; font-size: 0.875rem; transition: background 0.2s; }
  .btn:hover { background: #0056b3; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#003f87" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1>¡Recibimos tu solicitud!</h1>
  <p>Un especialista se pondrá en contacto contigo en menos de 10 minutos. Si es una urgencia, llámanos directamente.</p>
  <a href="tel:620602380" class="btn">
    <span class="material-symbols-outlined" style="font-size:1.25rem">call</span> 620 60 23 80
  </a>
  <p style="margin-top:1.5rem;font-size:0.8rem"><a href="/" style="color:var(--accent)">Volver a la página principal</a></p>
</div>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz@20..48&display=swap" rel="stylesheet">
</body>
</html>
